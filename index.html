<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Kawaii Life Planner - かわいい予定管理アプリ">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffb7c5">
    <title>Kawaii Life Planner</title>
    <!-- Google Fonts: Zen Maru Gothic for rounded, cute text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>My Kawaii Plan 🎀</h1>
            <div id="countdownDisplay" class="countdown-box hidden">
                <!-- Count down will be injected here -->
            </div>
            <div class="current-date" id="currentDate">2026年 2月</div>
        </header>

        <main>
            <!-- Calendar Section -->
            <section class="calendar-wrapper">
                <div class="calendar-header">
                    <button id="prevMonth" class="nav-btn" aria-label="前の月">◀</button>
                    <h2 id="monthLabel">February</h2>
                    <button id="nextMonth" class="nav-btn" aria-label="次の月">▶</button>
                </div>
                <div class="days-grid">
                    <div class="day-name sun">Sun</div>
                    <div class="day-name">Mon</div>
                    <div class="day-name">Tue</div>
                    <div class="day-name">Wed</div>
                    <div class="day-name">Thu</div>
                    <div class="day-name">Fri</div>
                    <div class="day-name sat">Sat</div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Days will be generated by JS -->
                </div>
            </section>

            <!-- Today's Schedule & To-Do -->
            <section class="daily-view">
                <h3>✨ Today's Tasks ✨</h3>
                <div class="todo-input-group">
                    <input type="text" id="todoInput" placeholder="新しい予定を追加してね..." enterkeyhint="done">
                    <button id="addTodoBtn">Add 💖</button>
                </div>
                <ul class="todo-list" id="todoList">
                    <!-- Tasks will act here -->
                </ul>
            </section>
        </main>

        <footer>
            <nav class="bottom-nav">
                <button class="nav-item active" id="navCalendar">📅<br>Calendar</button>
                <button class="nav-item" id="navMemo">📝<br>Memo</button>
                <button class="nav-item" id="navSettings">⚙️<br>Settings</button>
            </nav>
        </footer>
    </div>

    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="celebration-overlay hidden">
        <div class="celebration-content">
            <span class="celebration-emoji">🎉</span>
            <h2 id="celebrationMessage">えらすぎ！天才！</h2>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeSettingsModal">&times;</span>
            <h3>Settings ⚙️</h3>

            <h4 class="section-title">推し活カウントダウン 🔥</h4>

            <div class="input-group">
                <label for="countdownInterval">切り替え時間 (秒)</label>
                <input type="number" id="countdownInterval" min="1" value="3">
            </div>

            <div id="countdownList" class="countdown-list">
                <!-- List of added countdowns will appear here -->
            </div>

            <div class="add-countdown-box">
                <div class="input-group">
                    <label for="newCountdownTitle">何のイベント？</label>
                    <input type="text" id="newCountdownTitle" placeholder="ライブ、誕生日...">
                </div>
                <div class="input-group">
                    <label for="newCountdownDate">いつ？</label>
                    <input type="date" id="newCountdownDate">
                </div>
                <button id="addCountdownBtn" class="save-btn secondary">追加する ➕</button>
            </div>

            <h4 class="section-title" style="margin-top:20px;">テーマカラー 🎨</h4>
            <div class="theme-selector">
                <button class="theme-btn" data-theme="pink" style="background:#ffb7c5;">Pink</button>
                <button class="theme-btn" data-theme="blue" style="background:#a0e6ff;">Blue</button>
                <button class="theme-btn" data-theme="purple" style="background:#dcd0ff;">Purple</button>
                <button class="theme-btn" data-theme="black" style="background:#333; color:white;">Black</button>
                <button class="theme-btn" data-theme="mint" style="background:#98ff98;">Mint</button>
            </div>

            <h4 class="section-title" style="margin-top:20px;">背景テーマ (Z-Gen) ✨</h4>
            <div class="theme-selector">
                <button class="bg-btn" data-bg="" style="background:white; color:black;">初期</button>
                <button class="bg-btn" data-bg="aurora"
                    style="background:linear-gradient(120deg, #84fab0, #8fd3f4);">Aurora</button>
                <button class="bg-btn" data-bg="sunset"
                    style="background:linear-gradient(120deg, #f6d365, #fda085);">Sunset</button>
                <button class="bg-btn" data-bg="dream"
                    style="background:linear-gradient(120deg, #a18cd1, #fbc2eb);">Dream</button>
                <button class="bg-btn" data-bg="midnight"
                    style="background:linear-gradient(to top, #30cfd0, #330867); color:white;">Night</button>
            </div>

            <h4 class="section-title" style="margin-top:20px;">データ管理 💾</h4>
            <div class="data-manage-box">
                <button id="backupBtn" class="save-btn" style="background:#4CAF50; margin-bottom:10px;">データを保存する
                    (バックアップ) 📥</button>

                <div class="restore-group">
                    <label>データを復元する 📤</label>
                    <input type="file" id="restoreInput" accept=".json">
                    <button id="restoreBtn" class="save-btn" style="background:#FF9800; margin-top:5px;">復元実行
                        🔥</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for details -->
    <div id="eventModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeEventModal">&times;</span>
            <h3 id="modalDate">Daily Detail</h3>
            <div class="input-group">
                <label for="eventTitle">イベント名 (期間予定)</label>
                <input type="text" id="eventTitle" placeholder="旅行、テストなど...">
            </div>
            <div class="input-group">
                <label for="eventEndDate">終了日</label>
                <input type="date" id="eventEndDate">
            </div>

            <h4 class="section-title">日記・スタンプ</h4>

            <div class="input-group">
                <label>今日の1枚 📸</label>
                <div class="image-buttons">
                    <label class="upload-btn camera">
                        📷 カメラ起動
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
                    </label>
                    <label class="upload-btn gallery">
                        🖼️ アルバム
                        <input type="file" id="galleryInput" accept="image/*" style="display:none">
                    </label>
                </div>
                <div id="imagePreviewContainer" class="hidden">
                    <img id="imagePreview" src="" alt="Preview">
                    <button id="removeImageBtn" type="button">🗑️</button>
                </div>
            </div>

            <textarea id="eventDiary" placeholder="今日の日記や詳細..."></textarea>

            <div class="stamp-section">
                <p>スタンプ</p>
                <div class="stickers-selector" id="stickerSelector">
                    <span data-stamp="🧸">🧸</span>
                    <span data-stamp="🎨">🎨</span>
                    <span data-stamp="🍰">🍰</span>
                    <span data-stamp="🎧">🎧</span>
                    <span data-stamp="🏫">🏫</span>
                    <span data-stamp="💤">💤</span>
                    <span data-stamp="✈️">✈️</span>
                    <span data-stamp="💸">💸</span>
                    <span data-stamp="🏥">🏥</span>
                    <span data-stamp="🎂">🎂</span>
                    <span data-stamp="💑">💑</span>
                    <span data-stamp="💅">💅</span>
                </div>
            </div>
            <button id="saveEventBtn" class="save-btn">Save ✨</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>
</body>

</html>
